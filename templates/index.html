<!doctype html>
<html lang="en">
<head>
<script>
  (function() {
    const saved = localStorage.getItem('tc-theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<meta charset="utf-8">
<title>TriConnect — Sign → Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-logo" width="28" height="40" viewBox="0 0 28 40" aria-hidden="true">
        <circle class="dot-off" cx="8" cy="8" r="4"></circle>
        <circle class="dot-on" cx="8" cy="20" r="4"></circle>
        <circle class="dot-on" cx="8" cy="32" r="4"></circle>
        <circle class="dot-on" cx="20" cy="8" r="4"></circle>
        <circle class="dot-on" cx="20" cy="20" r="4"></circle>
        <circle class="dot-off" cx="20" cy="32" r="4"></circle>
      </svg>
      <div class="brand-text">
        <span class="brand-word">TriConnect</span>
        <span class="brand-tagline">SIGN · TEXT · BRAILLE</span>
      </div>
    </div>

    <div class="header-controls">
      <nav class="site-nav">
        <a href="/" class="active">Sign → Text</a>
        <a href="/braille">Text → Braille</a>
      </nav>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <span id="status" class="status-badge state-idle"><span class="dot"></span><span class="label">connecting…</span></span>
    </div>
  </header>

  <main>
    <section class="video-panel">
      <div class="camera-picker">
        <label for="cameraSelect">Camera</label>
        <select id="cameraSelect"></select>
      </div>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="letterBadge" class="letter-badge">–</div>
        <div id="cameraIdle" class="camera-idle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2"></rect>
          </svg>
          <p>Enable your camera to begin signing</p>
        </div>
      </div>
      <p class="hint">Hold a sign steady for about {{ stable_seconds }}s at ≥{{ (conf_threshold * 100) | round | int }}% confidence to accept it.</p>
    </section>

    <section class="output-panel">
      <div class="hero-card" id="predictionHero">
        <label>Live Prediction</label>
        <div class="cell-letter" id="heroLetter">–</div>
        <div class="cell-caption" id="heroCaption">Waiting for a hand…</div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <div class="card">
        <label>Sentence</label>
        <div id="sentence" class="sentence-box"></div>
        <div class="controls">
          <button id="btnSpace">Space</button>
          <button id="btnBackspace">Backspace</button>
          <button id="btnClear" class="danger">Clear</button>
        </div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
